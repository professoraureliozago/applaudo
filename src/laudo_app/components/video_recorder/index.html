<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body { margin: 0; font-family: sans-serif; background: transparent; width: fit-content; }
      .preview-wrap { max-width: 640px; }
      video {
        width: 100%;
        height: auto;
        object-fit: contain;
        background: #111;
        border-radius: 8px;
        display: block;
      }
      .controls { display: flex; gap: 8px; margin-top: 8px; }
      button { padding: 8px 12px; border: 0; border-radius: 6px; cursor: pointer; }
      .start { background: #0a7; color: #fff; }
      .stop { background: #c33; color: #fff; }
      .status { margin-top: 6px; font-size: 12px; color: #444; }
    </style>
  </head>
  <body>
    <div class="preview-wrap">
      <video id="preview" autoplay playsinline muted></video>
    </div>
    <div class="controls">
      <button class="start" id="startBtn">Iniciar gravacao</button>
      <button class="stop" id="stopBtn" disabled>Parar gravacao</button>
    </div>
    <div class="status" id="status">Aguardando camera...</div>

    <script>
      const video = document.getElementById("preview")
      const startBtn = document.getElementById("startBtn")
      const stopBtn = document.getElementById("stopBtn")
      const statusEl = document.getElementById("status")
      const frameId = `video-recorder-${Math.random().toString(36).slice(2)}`

      let stream = null

      function getHostWindow() {
        try {
          if (window.parent && window.parent !== window) {
            void window.parent.location.href
            return window.parent
          }
        } catch (error) {}
        return window
      }

      function getMediaHub() {
        const host = getHostWindow()
        if (!host.__applaudoMediaHub) {
          host.__applaudoMediaHub = {
            videoStream: null,
            videoStreamPromise: null,
            audioStream: null,
            audioStreamPromise: null,
            avStream: null,
            videoRecorderSession: null,
          }
        }
        return host.__applaudoMediaHub
      }

      function getRecorderSession() {
        const hub = getMediaHub()
        if (!hub.videoRecorderSession) {
          hub.videoRecorderSession = {
            recorder: null,
            stream: null,
            mimeType: "",
            sessionId: "",
            chunkCounter: 0,
            queue: [],
            acknowledgedEventId: "",
            lastSentEventId: "",
            statusText: "Aguardando camera...",
          }
        }
        return hub.videoRecorderSession
      }

      function post(type, payload = {}) {
        window.parent.postMessage({ isStreamlitMessage: true, type, ...payload }, "*")
      }

      function setReady() {
        post("streamlit:componentReady", { apiVersion: 1 })
      }

      function setHeight(height) {
        post("streamlit:setFrameHeight", { height })
      }

      function setValue(value) {
        post("streamlit:setComponentValue", { value })
      }

      function hasLiveTrack(mediaStream, kind) {
        return Boolean(
          mediaStream &&
          mediaStream.getTracks().some((track) => track.kind === kind && track.readyState === "live"),
        )
      }

      function buildPreviewStream(mediaStream) {
        if (!mediaStream) return null
        const videoTracks = mediaStream.getVideoTracks().filter((track) => track.readyState === "live")
        return videoTracks.length ? new MediaStream(videoTracks) : null
      }

      function getSharedVideoSource() {
        const hub = getMediaHub()
        if (hasLiveTrack(hub.avStream, "video")) return hub.avStream
        if (hasLiveTrack(hub.videoStream, "video")) return hub.videoStream
        return null
      }

      function getSharedAudioSource() {
        const hub = getMediaHub()
        if (hasLiveTrack(hub.avStream, "audio")) return hub.avStream
        if (hasLiveTrack(hub.audioStream, "audio")) return hub.audioStream
        return null
      }

      async function ensureSharedVideoStream() {
        const existing = getSharedVideoSource()
        if (existing) return existing

        const hub = getMediaHub()
        if (hub.videoStreamPromise) return hub.videoStreamPromise

        hub.videoStreamPromise = navigator.mediaDevices.getUserMedia({
          video: true,
          audio: false,
        }).then((mediaStream) => {
          hub.videoStream = mediaStream
          return mediaStream
        }).finally(() => {
          hub.videoStreamPromise = null
        })

        return hub.videoStreamPromise
      }

      async function ensureSharedAudioStream() {
        const existing = getSharedAudioSource()
        if (existing) return existing

        const hub = getMediaHub()
        if (hub.audioStreamPromise) return hub.audioStreamPromise

        hub.audioStreamPromise = navigator.mediaDevices.getUserMedia({
          video: false,
          audio: true,
        }).then((mediaStream) => {
          hub.audioStream = mediaStream
          return mediaStream
        }).finally(() => {
          hub.audioStreamPromise = null
        })

        return hub.audioStreamPromise
      }

      function updateFrameHeight() {
        const ratio = video.videoWidth && video.videoHeight ? (video.videoHeight / video.videoWidth) : (9 / 16)
        const videoHeight = Math.max(280, Math.floor(video.clientWidth * ratio))
        setHeight(videoHeight + 120)
      }

      function pickRecorderMimeType() {
        const candidates = [
          "video/webm;codecs=vp8,opus",
          "video/webm;codecs=vp9,opus",
          "video/webm",
        ]
        if (typeof MediaRecorder === "undefined") {
          return ""
        }
        for (const candidate of candidates) {
          if (!MediaRecorder.isTypeSupported || MediaRecorder.isTypeSupported(candidate)) {
            return candidate
          }
        }
        return ""
      }

      function attachPreview(mediaStream) {
        const previewStream = buildPreviewStream(mediaStream)
        if (previewStream && video.srcObject !== previewStream) {
          video.srcObject = previewStream
        }
      }

      async function ensureStream() {
        const session = getRecorderSession()
        if (stream && stream.getTracks().some((track) => track.readyState === "live")) {
          attachPreview(stream)
          return
        }

        if (session.stream && session.stream.getTracks().some((track) => track.readyState === "live")) {
          stream = session.stream
          attachPreview(stream)
          statusEl.textContent = session.statusText || "Camera pronta"
          updateFrameHeight()
          return
        }

        const videoSource = getSharedVideoSource() || await ensureSharedVideoStream()
        let audioSource = getSharedAudioSource()
        if (!audioSource) {
          try {
            audioSource = await ensureSharedAudioStream()
          } catch (error) {
            audioSource = null
          }
        }

        const videoTracks = videoSource ? videoSource.getVideoTracks().filter((track) => track.readyState === "live") : []
        const audioTracks = audioSource ? audioSource.getAudioTracks().filter((track) => track.readyState === "live") : []
        if (!videoTracks.length) {
          throw new Error("Nenhuma camera disponivel para gravacao.")
        }

        stream = new MediaStream([...videoTracks, ...audioTracks])
        getMediaHub().avStream = stream
        session.stream = stream
        session.statusText = audioTracks.length ? "Camera pronta" : "Camera pronta (sem audio)"
        attachPreview(stream)
        statusEl.textContent = session.statusText
        updateFrameHeight()
      }

      function syncQueueWithAck(ackEventId) {
        const session = getRecorderSession()
        if (!ackEventId) return
        session.acknowledgedEventId = ackEventId
        while (session.queue.length && session.queue[0].event_id === ackEventId) {
          session.queue.shift()
        }
        if (!session.queue.length) {
          session.lastSentEventId = ""
        }
      }

      function enqueueEvent(event) {
        const session = getRecorderSession()
        session.queue.push(event)
      }

      function flushQueue() {
        const session = getRecorderSession()
        if (!session.queue.length) {
          return
        }
        const nextEvent = session.queue[0]
        if (session.acknowledgedEventId === nextEvent.event_id) {
          session.queue.shift()
          session.lastSentEventId = ""
          flushQueue()
          return
        }
        if (session.lastSentEventId === nextEvent.event_id) {
          return
        }
        session.lastSentEventId = nextEvent.event_id
        setValue(nextEvent)
      }

      function applySessionState() {
        const session = getRecorderSession()
        statusEl.textContent = session.statusText || "Camera pronta"
        const isRecording = Boolean(session.recorder && session.recorder.state === "recording")
        startBtn.disabled = isRecording
        stopBtn.disabled = !isRecording
        if (!video.srcObject) {
          const previewSource = session.stream || getSharedVideoSource()
          if (previewSource) attachPreview(previewSource)
        }
      }

      function queueChunk(blob) {
        const session = getRecorderSession()
        if (!blob || !blob.size) return
        const chunkIndex = ++session.chunkCounter
        const eventId = `${session.sessionId}:chunk:${chunkIndex}`
        const reader = new FileReader()
        reader.onloadend = () => {
          enqueueEvent({
            event_kind: "chunk",
            event_id: eventId,
            session_id: session.sessionId,
            chunk_index: chunkIndex,
            mime_type: session.mimeType || "video/webm",
            timestamp: Date.now(),
            data_url: reader.result,
          })
          flushQueue()
        }
        reader.readAsDataURL(blob)
      }

      function queueFinalize() {
        const session = getRecorderSession()
        const eventId = `${session.sessionId}:finalize`
        enqueueEvent({
          event_kind: "finalize",
          event_id: eventId,
          session_id: session.sessionId,
          chunk_index: session.chunkCounter,
          mime_type: session.mimeType || "video/webm",
          timestamp: Date.now(),
        })
        flushQueue()
      }

      function finalizeRecorder(statusText) {
        const session = getRecorderSession()
        if (session.recorder && session.recorder.state === "recording") {
          session.statusText = statusText || "Finalizando gravacao..."
          applySessionState()
          session.recorder.stop()
        }
      }

      async function startRecord() {
        await ensureStream()
        const session = getRecorderSession()
        if (session.recorder && session.recorder.state === "recording") {
          applySessionState()
          return
        }

        session.sessionId = `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`
        session.chunkCounter = 0
        session.queue = []
        session.lastSentEventId = ""
        session.mimeType = pickRecorderMimeType() || "video/webm"
        session.statusText = "Gravando..."

        const activeRecorder = session.mimeType ? new MediaRecorder(stream, { mimeType: session.mimeType }) : new MediaRecorder(stream)
        session.recorder = activeRecorder
        session.stream = stream

        activeRecorder.ondataavailable = (event) => {
          if (event.data && event.data.size > 0) {
            queueChunk(event.data)
          }
        }
        activeRecorder.onerror = (event) => {
          session.statusText = `Erro na gravacao: ${event?.error?.message || "erro desconhecido"}`
          session.recorder = null
          applySessionState()
        }
        activeRecorder.onstop = () => {
          session.recorder = null
          session.statusText = "Gravacao finalizada - fechando arquivo..."
          queueFinalize()
          applySessionState()
        }

        activeRecorder.start(3000)
        applySessionState()
      }

      function stopRecord() {
        finalizeRecorder("Finalizando gravacao...")
      }

      function onRender(args) {
        syncQueueWithAck(String(args?.ack_event_id || ""))
        flushQueue()
        applySessionState()
      }

      startBtn.addEventListener("click", startRecord)
      stopBtn.addEventListener("click", stopRecord)
      video.addEventListener("loadedmetadata", updateFrameHeight)
      window.addEventListener("resize", updateFrameHeight)
      window.addEventListener("message", (event) => {
        const message = event.data
        if (!message || message.type !== "streamlit:render") {
          return
        }
        onRender(message.args || {})
      })

      setReady()
      setHeight(520)
      ensureStream().then(() => {
        applySessionState()
      }).catch((error) => {
        const session = getRecorderSession()
        session.statusText = `Erro camera: ${error?.message || error}`
        applySessionState()
      })
    </script>
  </body>
</html>
